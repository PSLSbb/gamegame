name: "borevibe Chat"
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Your message to the AI (base64)'
        required: true
        type: string
      history:
        description: 'Conversation history (base64 JSON array)'
        required: false
        type: string
      api_key:
        description: 'OpenCode (Zen) API key (base64)'
        required: true
        type: string
jobs:
  chat-turn:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install opencode
        run: |
          set +e
          npm install -g opencode-ai 2>&1 | tail -20
          if [ $PIPESTATUS -ne 0 ] || ! command -v opencode >/dev/null 2>&1; then
            echo "npm install failed, trying official installer..."
            curl -fsSL https://opencode.ai/install | bash 2>&1 | tail -20
          fi
          if command -v opencode >/dev/null 2>&1; then
            echo "opencode installed: $(opencode --version 2>&1 | head -1)"
          else
            echo "WARNING: opencode binary not available"
          fi
          exit 0
      - name: Configure opencode auth
        env:
          API_KEY_B64: ${{ github.event.inputs.api_key }}
        run: |
          mkdir -p "$HOME/.local/share/opencode"
          API_KEY=$(printf '%s' "$API_KEY_B64" | base64 -d)
          jq -n --arg k "$API_KEY" '{opencode: {type: "api", key: $k}}' > "$HOME/.local/share/opencode/auth.json"
          chmod 600 "$HOME/.local/share/opencode/auth.json"
      - name: Build prompt with history
        id: build_prompt
        env:
          PROMPT_B64: ${{ github.event.inputs.prompt }}
          HISTORY_B64: ${{ github.event.inputs.history }}
          SYSTEM_PROMPT: 'You are BoreVibe, a coding assistant for this GitHub repository. You have read-write access and may create, edit, or delete files to fulfill the user request. Prefer small, focused changes. Reply with ONLY a clean, self-contained answer in GitHub-flavored Markdown: short headings, bullet lists, and fenced code blocks where useful. Never include file reads, shell commands, directory listings, or tool narration in your answer. If you changed files, end with a short list of files you changed.'
        run: |
          PROMPT=$(printf '%s' "$PROMPT_B64" | base64 -d)
          HISTORY=$(printf '%s' "$HISTORY_B64" | base64 -d 2>/dev/null || echo '[]')
          if ! echo "$HISTORY" | jq -e . >/dev/null 2>&1; then HISTORY='[]'; fi
          jq -n --argjson h "$HISTORY" --arg p "$PROMPT" --arg s "$SYSTEM_PROMPT"             '{history: $h, new_prompt: $p, system: $s}' |
            jq -r '.history + [{"role": "system", "content": .system}, {"role": "user", "content": .new_prompt}] | map(.role + ": " + .content) | join("\n")' > full_prompt.txt ||
            printf '%s\n' "$PROMPT" > full_prompt.txt
      - name: Run opencode
        id: generate
        shell: bash
        run: |
          set +eo pipefail
          opencode run --auto --format default -m opencode/deepseek-v4-flash-free "$(cat full_prompt.txt)" > ai_reply_raw.txt 2> opencode_stderr.log || true
          node -e '
            const fs = require("fs");
            const raw = fs.existsSync("ai_reply_raw.txt") ? fs.readFileSync("ai_reply_raw.txt", "utf8") : "";
            let lines = raw.split("\n");
            while (lines.length && /^\s*> /.test(lines[0])) lines.shift();
            while (lines.length && lines[0].trim() === "") lines.shift();
            const out = [];
            let blanks = 0;
            for (let i = 0; i < lines.length; i++) {
              if (lines[i].trim() === "") { blanks++; if (blanks > 1) continue; } else blanks = 0;
              out.push(lines[i]);
            }
            fs.writeFileSync("ai_reply.txt", out.join("\n").trim() + "\n");
          '
          rm -rf "ai_reply_raw.txt"
          if [ ! -s ai_reply.txt ]; then
            printf '%s\n' "The agent returned no reply." > ai_reply.txt
          fi
      - name: Upload reply artifact
        uses: actions/upload-artifact@v4
        with:
          name: borevibe-reply
          path: ai_reply.txt
          if-no-files-found: warn
      - name: Open PR with changes
        env:
          RUN_ID: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROMPT_B64: ${{ github.event.inputs.prompt }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "borevibe Bot"
          git config user.email "borevibe@bot.local"
          BRANCH="borevibe/process/${RUN_ID}"
          git checkout -B "$BRANCH" 2>/dev/null || git switch -c "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit — nothing to review"
            exit 0
          fi
          git -c user.name="borevibe Bot" -c user.email="borevibe@bot.local" commit -m "borevibe: process ${RUN_ID}" --allow-empty-message 2>&1 | tail -3
          git push -u origin "$BRANCH" 2>&1 | tail -3
          BODY_FILE=opencode_prompt.txt
          PROMPT_PLAIN=$(printf '%s' "$PROMPT_B64" | base64 -d 2>/dev/null)
          printf '%s\n' "$PROMPT_PLAIN" > "$BODY_FILE"
          gh pr create --base "${DEFAULT_BRANCH}" --head "$BRANCH" --title "borevibe: run ${RUN_ID}" --body-file "$BODY_FILE" 2>&1 | tail -3 || echo "(PR may already exist)"
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: borevibe-logs
          path: |
            ai_reply.txt
            full_prompt.txt
            opencode_stderr.log
