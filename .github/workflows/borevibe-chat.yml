name: "borevibe Chat"
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Your message to the AI (base64)'
        required: true
        type: string
      history:
        description: 'Conversation history (base64 JSON array)'
        required: false
        type: string
jobs:
  chat-turn:
    runs-on: ubuntu-latest
    concurrency:
      group: borevibe-chat
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install opencode
        run: |
          set +e
          npm install -g opencode-ai 2>&1 | tail -20
          if [ $PIPESTATUS -ne 0 ] || ! command -v opencode >/dev/null 2>&1; then
            echo "npm install failed, trying official installer..."
            curl -fsSL https://opencode.ai/install | bash 2>&1 | tail -20
          fi
          if command -v opencode >/dev/null 2>&1; then
            echo "opencode installed: $(opencode --version 2>&1 | head -1)"
          else
            echo "WARNING: opencode binary not available"
          fi
          exit 0
      - name: Configure opencode auth
        env:
          API_KEY: ${{ secrets.BOREVIBE_API_KEY }}
        run: |
          mkdir -p "$HOME/.local/share/opencode"
          jq -n --arg k "$API_KEY" '{opencode: {type: "api", key: $k}}' > "$HOME/.local/share/opencode/auth.json"
          chmod 600 "$HOME/.local/share/opencode/auth.json"
      - name: Isolate on PR branch
        env:
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "borevibe Bot"
          git config user.email "borevibe@bot.local"
          BRANCH="borevibe/process/${RUN_ID}"
          git checkout -b "$BRANCH" 2>&1
          git config --local --unset-all "http.https://github.com/.extraheader" 2>/dev/null || true
          git config --local --unset-all credential.helper 2>/dev/null || true
          git remote set-url origin "https://github.com/${REPO}.git" 2>&1
          echo "isolated on $BRANCH (push credentials removed)"
      - name: Build prompt with history
        id: build_prompt
        env:
          PROMPT_B64: ${{ github.event.inputs.prompt }}
          HISTORY_B64: ${{ github.event.inputs.history }}
          SYSTEM_PROMPT: 'You are BoreVibe, a coding assistant for this GitHub repository. Your job is to ACTUALLY make the requested change by editing, creating, or deleting real files with your tools. You MUST call your file tools — do not just describe what you would do. Work is tracked on a review branch; never run git commands yourself (no add, commit, push, checkout, branch). After editing, reply with ONLY a clean, self-contained answer in GitHub-flavored Markdown: short headings, bullet lists, and fenced code blocks where useful. Never include file reads, shell commands, directory listings, or tool narration in your answer. If you changed files, end with a short list of files you changed.'
        run: |
          PROMPT=$(printf '%s' "$PROMPT_B64" | base64 -d)
          HISTORY=$(printf '%s' "$HISTORY_B64" | base64 -d 2>/dev/null || echo '[]')
          if ! echo "$HISTORY" | jq -e . >/dev/null 2>&1; then HISTORY='[]'; fi
          jq -n --argjson h "$HISTORY" --arg p "$PROMPT" --arg s "$SYSTEM_PROMPT" \
            '{history: $h, new_prompt: $p, system: $s}' |
            jq -r '.history + [{"role": "system", "content": .system}, {"role": "user", "content": .new_prompt}] | map(.role + ": " + .content) | join("\n")' > full_prompt.txt ||
            printf '%s\n' "$PROMPT" > full_prompt.txt
      - name: Run opencode
        id: generate
        shell: bash
        env:
          GITHUB_TOKEN: ''
        run: |
          set +eo pipefail
          export GITHUB_TOKEN=
          opencode run --auto --format default -m opencode/deepseek-v4-flash-free "$(cat full_prompt.txt)" > ai_reply_raw.txt 2> opencode_stderr.log || true
          node -e '
            const fs = require("fs");
            const raw = fs.existsSync("ai_reply_raw.txt") ? fs.readFileSync("ai_reply_raw.txt", "utf8") : "";
            let lines = raw.split("\n");
            while (lines.length && /^\s*> /.test(lines[0])) lines.shift();
            while (lines.length && lines[0].trim() === "") lines.shift();
            const out = [];
            let blanks = 0;
            for (let i = 0; i < lines.length; i++) {
              if (lines[i].trim() === "") { blanks++; if (blanks > 1) continue; } else blanks = 0;
              out.push(lines[i]);
            }
            fs.writeFileSync("ai_reply.txt", out.join("\n").trim() + "\n");
          '
          rm -rf "ai_reply_raw.txt"
          if [ ! -s ai_reply.txt ]; then
            printf '%s\n' "The agent returned no reply." > ai_reply.txt
          fi
      - name: Verify real changes
        run: |
          CHANGED=$(git status --porcelain | wc -l)
          echo "changed_files=$CHANGED"
          node -e '
            const fs = require("fs");
            const execSync = require("child_process").execSync;
            let note;
            try {
              const files = execSync("git status --porcelain", { encoding: "utf8" })
                .split("\n").filter(Boolean).map((l) => l.slice(3).trim()).filter(Boolean).slice(0, 20);
              note = files.length ? "Changed files: " + files.join(", ") : "No file changes were found on the review branch.";
            } catch {
              note = "Could not read the working tree.";
            }
            fs.appendFileSync("ai_reply.txt", "\n\n> " + note + "\n");
          '
      - name: Push changes and open PR
        env:
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROMPT_B64: ${{ github.event.inputs.prompt }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          set -o pipefail
          BRANCH="borevibe/process/${RUN_ID}"
          git config user.name "borevibe Bot"
          git config user.email "borevibe@bot.local"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes produced on the branch — nothing to review" >&2
            printf '%s\n' "> PR skipped: no changes produced." >> ai_reply.txt
            exit 0
          fi
          git add -A
          git commit -m "borevibe: process ${RUN_ID}" --allow-empty-message 2>&1 | tail -2
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push -u origin "HEAD:refs/heads/${BRANCH}" 2>&1 | tail -3
          PUSH_STATUS=${PIPESTATUS[0]}
          if [ "$PUSH_STATUS" -ne 0 ]; then
            printf '%s\n' "> PR creation failed: git push exited with status ${PUSH_STATUS}" >> ai_reply.txt
            exit "$PUSH_STATUS"
          fi
          BODY_FILE=opencode_prompt.txt
          PROMPT_PLAIN=$(printf '%s' "$PROMPT_B64" | base64 -d 2>/dev/null)
          printf '%s\n' "$PROMPT_PLAIN" > "$BODY_FILE"
          PR_OUT=$(gh pr create --base "${DEFAULT_BRANCH}" --head "$BRANCH" --title "borevibe: process ${RUN_ID}" --body-file "$BODY_FILE" 2>&1 | tail -5)
          GH_STATUS=${PIPESTATUS[0]}
          if [ "$GH_STATUS" -eq 0 ]; then
            if [ -n "$PR_OUT" ]; then
              printf '%s\n' "> PR created: ${PR_OUT}" >> ai_reply.txt
            else
              printf '%s\n' "> PR created: (no URL returned)" >> ai_reply.txt
            fi
          else
            printf '%s\n' "> PR creation failed: gh pr create exited with status ${GH_STATUS}" >> ai_reply.txt
            echo "gh pr create failed (exit ${GH_STATUS})" >&2
          fi
          exit 0
      - name: Upload reply artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: borevibe-reply
          path: ai_reply.txt
          if-no-files-found: warn
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: borevibe-logs
          path: |
            ai_reply.txt
            full_prompt.txt
            opencode_stderr.log
